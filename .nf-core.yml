lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rnaseq_logo_light.png
    - docs/images/nf-core-rnaseq_logo_light.png
    - docs/images/nf-core-rnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-rnaseq_logo_light.png
    - docs/images/nf-core-rnaseq_logo_light.png
    - docs/images/nf-core-rnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
  multiqc_config:
    - report_comment
    - report_section_order
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  readme:
    - nextflow_badge
nf_core_version: 3.5.2
repository_type: pipeline
template:
  author: M. Bonfanti, C. Callierotti, G. Scotti
  description: Alignment and downstream analysis of bulk RNAseq data
  force: false
  is_nfcore: false
  name: rnaseq
  org: nfdata-omics
  outdir: .
  skip_features:
    - github_badges
  version: 0.0.0dev
