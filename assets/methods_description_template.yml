data: |
  <h4>Methods</h4>
  <p>Raw sequencing reads were processed using fastp to remove adapter sequences and filter out low-quality reads. High-quality reads were then aligned to the reference genome using the STAR aligner.<br>
  Uniquely mapped reads were assigned to genomic features using featureCounts (from the Subread package), according to the corresponding gene annotations (GENCODE basic annotations for human, mouse, and other supported species). Only reads mapping to coding regions of the genome were retained for gene-level quantification.<br>
  Downstream analyses were performed in the R statistical environment.<br>
  Raw counts were normalized to CPM and RPKM values and used to assess sample correlations and the variability structure of the dataset through Principal Component Analysis (PCA) and Multidimensional Scaling (MDS).
  Expressed genes were defined as those showing at least 1 CPM in at least N samples, where N corresponds to the size of the smallest group being compared.<br>
  Differential gene expression (DGE) analysis was performed on all expressed genes using the DESeq2 R package, with no prior distribution assumption (betaPrior = FALSE) and with independent filtering applied to the results. Significant genes were identified using a threshold of FDR < 0.05.<br>
  Functional enrichment analysis (when performed) was conducted using over-representation analysis (ORA) and pre-ranked Gene Set Enrichment Analysis (GSEA), as implemented in the clusterProfiler R package. Enrichment was evaluated using gene sets from the three Gene Ontology (GO) domains (biological process, molecular function, and cellular component), canonical pathway collections (e.g., KEGG, BioCarta, Reactome), and Hallmark gene sets from the Molecular Signatures Database (MSigDB).</p>
  <h4>Bioinformatics pipeline</h4>
  <p>Data was processed using nfdata-omics/rnaseq v${workflow.manifest.version} ${doi_text} of the nf-core collection of workflows (<a href="https://doi.org/10.1038/s41587-020-0439-x">Ewels <em>et al.</em>, 2020</a>), utilising reproducible software environments from the Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Grüning <em>et al.</em>, 2018</a>) and Biocontainers (<a href="https://doi.org/10.1093/bioinformatics/btx192">da Veiga Leprevost <em>et al.</em>, 2017</a>) projects.</p>
  <p>The pipeline was executed with Nextflow v${workflow.nextflow.version} (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) with the following command:</p>
  <pre><code>${workflow.commandLine}</code></pre>
