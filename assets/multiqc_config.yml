report_comment: >
  This report has been generated by the <a href="https://github.com/nfdata-omics/rnaseq/tree/dev" target="_blank">nfdata-omics/rnaseq</a>
  analysis pipeline.
report_section_order:
  # Important checks and failures
  sample-status:
    order: 5004
  fail_trimmed_samples-module:
    order: 5003
  fail_mapped_samples-module:
    order: 5002
  fail_strand_check-module:
    order: 5001
  # Preprocessing and pre-alignment QC
  cutadapt:
    order: 4003
  fastp:
    order: 4003
  fastqc_trimmed:
    order: 4002
  # Alignment
  star:
    order: 3100
  # Post-alignment QC
  picard:
    order: 3001
  samtools:
    order: 3002
  # Quantification
  featurecounts:
    order: 2002
  # Post-quantification QC
  biotype_counts:
    order: 2001
  sample_correlation:
    order: 2000
  # Normalization and dimensionality reduction
  r_count_norm:
    order: 901
  dim_reduction:
    order: 900
  # Differential expression analysis
  deseq2:
    order: 800
  # Summaries
  "nfdata-omics-rnaseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nfdata-omics-rnaseq-summary":
    order: -1002

export_plots: true
disable_version_detection: true
sample_names_replace_exact: true
skip_generalstats: false

table_sample_merge:
  "R1": "_trimmed_1"
  "R2": "_trimmed_2"

title: "RNASeq"
subtitle: |
  <a href="https://humantechnopole.it/en/facilities/national-facility-for-data-handling-analysis/">National Facility for Data Handling and Analysis</a> - Human Technopole 
intro_text: |
  This report includes the results of the RNASeq analysis pipeline developed by the National Facility for Data 
  Handling and Analysis based on the nf-core/rnaseq pipeline, with some modifications to suit our needs.
  This pipeline performs quality control, alignment, quantification, and differential expression analysis of bulk
  transcriptomics data.

# Run only these modules
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - fastp
  - star
  - salmon
  - featurecounts
  - samtools
  - picard
  - deseq2
  - dim_reduction
  - r_count_norm

# Order of modules

module_order:
  - cutadapt
  - fastp:
      anchor: "fastp"
      name: "Initial QC and Trimming"
      info: |
        This section of the report shows the initial quality control, with the results
        of the trimming and filtering steps performed by the fastp tool. 
      extra: |
        Fastp is a fast all-in-one preprocessing tool for FastQ files. It provides
        fast and accurate adapter trimming, quality filtering, and read deduplication.
        It also generates a variety of quality control metrics.
  - fastqc:
      anchor: "fastqc_trimmed"
      name: "Post Processing QC"
      info: "This section of the report shows FastQC results after adapter trimming."
      path_filters:
        - "*_trimmed*fastqc.zip"
  - star:
      anchor: "star"
      name: "Alignment"
      info: |
        This section of the report shows the results of the STAR alignment step.
        STAR is a fast and accurate aligner for RNA-Seq data.
  - samtools:
      anchor: "samtools"
      name: "Post Alignment QC - samtools"
      info: |
        This section of the report shows the results of the post-alignment quality control
        steps performed by samtools.
  - picard:
      anchor: "picard"
      name: "Post Alignment QC - Picard"
      info: |
        This section of the report shows the results of the post-alignment quality control
        steps performed by Picard.
  - featurecounts:
      anchor: "featurecounts"
      name: "Quantification"
      info: |
        This section of the report shows the results of the featureCounts quantification step.
        featureCounts is a read summarization tool for RNA-Seq data.
  - r_count_norm:
      anchor: "r_count_norm"
      name: "Normalization"
      info: |
        This section of the report shows the results of the normalization step.
        The normalization method used is TMM (Trimmed Mean of M-values).
  - deseq2:
      anchor: "deseq2"
      name: "Differential Expression Analysis"
      info: |
        This section of the report shows the results of DESeq2. DESeq2 is a 
        statistical package for analyzing count data and performing differential expression
        analysis of transcriptomics data.

# Don't show % Dups in the General Stats table (we have this from Picard)
table_columns_visible:
  "FastQC (trimmed)":
    percent_duplicates: false

extra_fn_clean_exts:
  - ".umi_dedup"
  - "_val"
  - ".markdup"
  - "_primary"

# Customise the module search patterns to speed up execution time
#  - Skip module sub-tools that we are not interested in
#  - Replace file-content searching with filename pattern searching
#  - Don't add anything that is the same as the MultiQC default
# See https://multiqc.info/docs/#optimise-file-search-patterns for details
sp:
  cutadapt:
    fn: "*trimming_report.txt"

  fastp:
    fn: "*.fastp.json"

  salmon/meta:
    fn: "meta_info.json"

  samtools/stats:
    fn: "*.stats"
  samtools/flagstat:
    fn: "*.flagstat"
  samtools/idxstats:
    fn: "*.idxstats*"

  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"

  sample_correlation:
    fn: '*_correlation_table.txt'

# See https://github.com/ewels/MultiQC_TestData/blob/master/data/custom_content/with_config/table_headerconfig/multiqc_config.yaml
custom_data:
  sample_correlation:
    id: 'sample_correlation'
    section_name: 'Sample-to-sample Correlation'
    description: |
      Sample-to-sample Pearsons' correlation is calculated from the normalized counts.
      The heatmap shows the correlation between samples, with red indicating
      higher correlation and blue indicating lower correlation.
    plot_type: 'heatmap'
    pconfig:
      id: 'correlation_heatmap'
    sort_rows: true
  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "List of samples that failed the minimum trimmed reads threshold
      specified via the '--min_trimmed_reads' parameter, and hence were ignored for
      the downstream processing steps."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
  fail_mapped_samples:
    section_name: "WARNING: Fail Alignment Check"
    description: "List of samples that failed the STAR minimum mapped reads threshold
      specified via the '--min_mapped_reads' parameter, and hence were ignored for
      the downstream processing steps."
    plot_type: "table"
    pconfig:
      id: "fail_mapped_samples_table"
      title: "Samples failed mapping threshold"
      namespace: "Samples failed mapping threshold"
  fail_strand_check:
    section_name: "Strandedness Checks"
    description: "<p>The strandedness used for analysis in this workflow can either
      be provided by the user or automatically inferred by <b>Salmon</b> using a sample
      of reads. In both cases, strandedness is verified at the end of the workflow
      using <b>RSeQC</b>'s <a href='http://rseqc.sourceforge.net/#infer-experiment-py'>infer_experiment.py</a>
      on genomic alignments. In this table, a pass indicates a match between the supplied
      strandedness (or that inferred by Salmon) and RSeQC results. A fail indicates
      a mismatch or 'undetermined' strandedness. 'Undetermined' strandedness can signal
      QC issues, including potential genomic DNA contamination.</p><p><b>Note:</b>
      Rows are duplicated for an 'auto' setting to allow comparison of statistics
      between inference methods.</p>"
    plot_type: "table"
    pconfig:
      id: "fail_strand_check_table"
      title: "Samples strandedness check"
      namespace: "Samples strandedness check"
    headers:
      Status:
        description: Pass if the strandedness inferred by RSeQC matches that provided
          by the user or predicted by Salmon. Fail otherwise.
      Strand inference method:
        description: Tool used to detect strandedness
      Provided strandedness:
        description: User-provided strandedness
        cond_formatting_rules:
          blue:
            - s_eq: "auto"
          black:
            - s_eq: "forward"
          grey:
            - s_eq: "reverse"
        cond_formatting_colours:
          - grey: "#AAB7B8"
          - black: "#17202A"
      Inferred strandedness:
        description: Interred strandedness
        cond_formatting_rules:
          blue:
            - s_eq: "auto"
          black:
            - s_eq: "forward"
          grey:
            - s_eq: "reverse"
        cond_formatting_colours:
          - grey: "#AAB7B8"
          - black: "#17202A"
      Sense (%):
        max: 100
      Antisense (%):
        max: 100
      Unstranded (%):
        max: 100
